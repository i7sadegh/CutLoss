name: Apply Changes and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-changes.sh'

concurrency:
  group: apply-and-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply changes from script
        run: bash scripts/apply-changes.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes produced by script."
          else
            git commit -m "Apply changes from apply-changes.sh"
            git push
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CutStudio APK
        uses: actions/upload-artifact@v7
        with:
          name: CutStudio-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
