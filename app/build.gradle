plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

apply plugin: 'com.mikepenz.aboutlibraries.plugin'

aboutLibraries {
    excludeFields = ["generated"]
}

android {
    namespace 'com.tharunbirla.librecuts'
    compileSdk 34

    androidResources {
        generateLocaleConfig = true
    }

    lint {
        disable 'UseAppTint', 'MissingTranslation', 'ExtraTranslation'
    }

    defaultConfig {
        applicationId "com.i7sadegh.cutloss"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 12
        versionName "1.0-beta9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Phase 16: ship ONE APK for arm64-v8a devices only (user
        // request). The ffmpeg-kit native libraries for the other ABIs
        // are dropped from the package, which also shrinks the APK a lot.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        debug {
            // Phase 9: committed debug key so every CI build keeps
            // the same signature and installs over previous debug
            // APKs (see app/debug.keystore).
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // Phase 0 cleanup: enable R8 code shrinking/optimization for release
            // builds. Safe rules for Gson-serialized models and ffmpeg-kit JNI
            // bindings live in proguard-rules.pro.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Phase 16: the per-ABI split APKs and their version-code offsets are
    // gone - the single arm64-v8a build (ndk.abiFilters above) replaces
    // all of them.
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation("com.antonkarpenko:ffmpeg-kit-full-gpl:2.1.0")
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.airbnb.android:lottie:3.4.0'
    implementation "com.mikepenz:aboutlibraries-core:11.2.3"
    implementation "com.mikepenz:aboutlibraries:11.2.3"
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'com.google.code.gson:gson:2.10.1'
}
